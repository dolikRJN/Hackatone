<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-label="Аватар игрока" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
