<!DOCTYPE html>
<html lang="ru" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рейтинг скорости печати — таблица лидеров «Печати героя»</title>
  <meta name="description" content="Рейтинг игроков тренажёра «Печать героя»: скорость печати, точность и заработанный опыт. Сравнивайте результаты за день, неделю и всё время.">
  <meta name="theme-color" content="#15123a">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Печать героя">
  <meta property="og:title" content="Рейтинг скорости печати — Печать героя">
  <meta property="og:description" content="Таблица лидеров по скорости и точности печати. Сравнивайте результаты тренировок за день, неделю и всё время.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Таблица лидеров — Печать героя">
  <meta name="twitter:description" content="Сравнивайте скорость, точность и опыт игроков тренажёра слепой печати.">
  <!-- SEO_META -->
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">Печать героя</a>
    <nav class="nav" aria-label="Основное меню">
      <a href="/game" data-play>Играть</a>
      <a href="/leaderboard" aria-current="page">Лидеры</a>
      <a href="/profile">Профиль</a>
    </nav>
    <a class="logout" href="/auth" data-only="guest">Войти</a>
    <div class="account" data-account data-only="user" hidden></div>
  </header>

  <main class="page">
    <h1>Таблица лидеров</h1>
    <p>Сравнивайте скорость печати, точность и опыт игроков. Выберите показатель и период, чтобы увидеть результаты тренировок.</p>
    <p id="leaders-status" role="status">Загрузка рейтинга…</p>

    <!-- Фильтры: data-metric / data-period переключает JS и запрашивает данные у бэкенда -->
    <div class="toolbar">
      <div class="seg" role="tablist" aria-label="Рейтинг по" id="metric">
        <button role="tab" aria-selected="true" data-metric="speed">Скорость</button>
        <button role="tab" aria-selected="false" data-metric="accuracy">Точность</button>
        <button role="tab" aria-selected="false" data-metric="xp">Опыт</button>
      </div>
      <div class="seg" role="tablist" aria-label="Период" id="period">
        <button role="tab" aria-selected="false" data-period="day">Сегодня</button>
        <button role="tab" aria-selected="false" data-period="week">Неделя</button>
        <button role="tab" aria-selected="true" data-period="all">Всё время</button>
      </div>
    </div>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th scope="col" data-field="rank">#</th><th scope="col" data-field="username">Игрок</th><th scope="col" data-field="wpm" class="num">Слов/мин</th><th scope="col" data-field="cpm" class="num">Симв/мин</th><th scope="col" data-field="accuracy" class="num">Точность</th><th scope="col" data-field="xp" class="num">Опыт</th></tr>
          </thead>
          <tbody id="leaders"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/js/auth.js" defer></script>
  <script src="/static/js/leaderboard.js" defer></script>
</body>
</html>
