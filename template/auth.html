<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход и регистрация — Печать героя</title>
  <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
  <main class="auth">
    <section class="auth__brand">
      <a href="index.html" style="text-decoration:none">
        <div class="keys-title" role="img" aria-label="Печать героя">
          <div class="keys-title__row">
            <span class="cap" style="--i:0">П</span><span class="cap" style="--i:1">Е</span><span class="cap" style="--i:2">Ч</span><span class="cap" style="--i:3">А</span><span class="cap" style="--i:4">Т</span><span class="cap cap--hot" style="--i:5">Ь</span>
          </div>
          <div class="keys-title__row">
            <span class="cap" style="--i:6">Г</span><span class="cap" style="--i:7">Е</span><span class="cap" style="--i:8">Р</span><span class="cap" style="--i:9">О</span><span class="cap" style="--i:10">Я</span>
          </div>
        </div>
      </a>
      <p>Прогресс сохраняется в аккаунте и доступен на любом устройстве.</p>
    </section>

    <section class="auth__form">
      <div class="form">
        <div class="seg seg--full" role="tablist" aria-label="Вход или регистрация">
          <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="form-login">Вход</button>
          <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="form-register">Регистрация</button>
        </div>

        <!-- Вход -->
        <form class="form" id="form-login" role="tabpanel" aria-labelledby="tab-login">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" placeholder="you@mail.ru" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="login-password">Пароль</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="form__error" id="login-error" role="alert" hidden></p>
          <button class="btn btn--block" type="submit">Войти</button>
          <p class="form__switch">Нет аккаунта? <a href="auth.html?mode=register" data-switch="register">Зарегистрироваться</a></p>
        </form>

        <!-- Регистрация -->
        <form class="form" id="form-register" role="tabpanel" aria-labelledby="tab-register" hidden>
          <div class="field">
            <label for="reg-nickname">Никнейм</label>
            <input id="reg-nickname" name="nickname" type="text" minlength="3" maxlength="20" autocomplete="nickname" required>
            <span class="field__hint">Его увидят в таблице лидеров. От 3 до 20 символов.</span>
          </div>
          <div class="field">
            <label for="reg-email">Email</label>
            <input id="reg-email" name="email" type="email" placeholder="you@mail.ru" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="reg-password">Пароль</label>
            <input id="reg-password" name="password" type="password" minlength="6" autocomplete="new-password" required>
            <span class="field__hint">Минимум 6 символов.</span>
          </div>
          <div class="field">
            <label for="reg-password2">Повтори пароль</label>
            <input id="reg-password2" name="password2" type="password" minlength="6" autocomplete="new-password" required>
          </div>
          <p class="form__error" id="register-error" role="alert" hidden></p>
          <button class="btn btn--block" type="submit">Создать аккаунт</button>
          <p class="form__switch">Уже есть аккаунт? <a href="auth.html" data-switch="login">Войти</a></p>
        </form>
      </div>
    </section>
  </main>
  <script src="./static/js/auth.js"></script>
</body>
</html>
